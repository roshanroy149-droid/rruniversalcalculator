<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moved to VenStock | TallyBench</title>
<!-- The product was briefly published under the name StockBench before being
     renamed to VenStock, so this URL redirects rather than 404s. Same
     reasoning as tallystock.html: GitHub Pages is static, so canonical +
     meta refresh + JS is the closest thing to a 301 available. Safe to
     delete once the old URL has dropped out of the index. No nav markers on
     purpose — it's a redirect, not a page, so Sync-Nav listing it as
     marker-less is expected. -->
<link rel="canonical" href="https://tallybench.com/venstock.html">
<meta name="robots" content="noindex, follow">
<meta http-equiv="refresh" content="0; url=venstock.html">
<script>window.location.replace('venstock.html');</script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="eyebrow">// MOVED</div>
    <h1>StockBench is now VenStock</h1>
    <p>This page has moved to <a href="venstock.html">venstock.html</a>. You should be redirected automatically.</p>
  </section>
</div>
</body>
</html>
