name: Notify IndexNow of changed pages

# Pings Bing/Yandex/etc. (via the shared IndexNow protocol) with exactly the
# HTML pages that changed in this push, right after every deploy — instead
# of waiting for the next scheduled crawl to notice new or updated content.
# The API key below is public by design (IndexNow's own docs note the key
# is not a secret — it's just a lightweight domain-ownership proof, verified
# via the matching key file hosted at the repo root), so no GitHub secret is
# needed here.

on:
  push:
    branches: [main]

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed HTML files and submit to IndexNow
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            CHANGED=$(git diff --name-only "${AFTER_SHA}^" "${AFTER_SHA}" -- '*.html' 2>/dev/null || true)
          else
            CHANGED=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- '*.html')
          fi

          if [ -z "$CHANGED" ]; then
            echo "No HTML changes in this push, skipping IndexNow submission."
            exit 0
          fi

          # Sync-Nav rewrites the nav and tool-count block on every page whenever
          # a tool is added, so a one-tool push shows ~190 files as "changed"
          # while only a handful differ in actual content. Submitting all of them
          # tells Bing the whole site changed, every time. Compare each file with
          # the generated marker blocks stripped out, and keep only the ones whose
          # real content moved.
          STRIP='s/<!-- TB:(NAV|COUNT|HOMEGRID|ARTICLELIST|SEARCHDATA|BREADCRUMB):START -->.*?<!-- TB:\1:END -->//gs'
          REAL=""
          for f in $CHANGED; do
            if ! git cat-file -e "${BEFORE_SHA}:${f}" 2>/dev/null; then
              REAL="${REAL}${f}"$'\n'; continue          # brand new page
            fi
            a=$(git show "${BEFORE_SHA}:${f}" | perl -0777 -pe "$STRIP" | md5sum)
            b=$(git show "${AFTER_SHA}:${f}"  | perl -0777 -pe "$STRIP" | md5sum)
            if [ "$a" != "$b" ]; then REAL="${REAL}${f}"$'\n'; fi
          done

          TOTAL=$(echo "$CHANGED" | grep -c . || true)
          KEPT=$(echo "$REAL" | grep -c . || true)
          echo "Changed files: $TOTAL — of which real content changes: $KEPT (nav-only skipped: $((TOTAL - KEPT)))"

          if [ -z "$(echo "$REAL" | tr -d '[:space:]')" ]; then
            echo "Only generated nav/count blocks changed. Nothing worth re-submitting."
            exit 0
          fi

          URLS_JSON=$(echo "$REAL" | sed 's#^#https://tallybench.com/#' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Submitting changed URLs to IndexNow:"
          echo "$URLS_JSON"

          curl -s -o /dev/stderr -w "\nIndexNow response status: %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"tallybench.com\",\"key\":\"cea41b609d124e96b6b760f3d15617cc\",\"keyLocation\":\"https://tallybench.com/cea41b609d124e96b6b760f3d15617cc.txt\",\"urlList\":$URLS_JSON}"
