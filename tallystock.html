<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moved to VenStock | TallyBench</title>
<!-- This product was renamed from TallyStock to VenStock. The old URL was
     live briefly and submitted to search engines, so this stub redirects
     rather than 404s. GitHub Pages serves static files only, so there's no
     server-side 301 available — canonical + meta refresh + JS is the closest
     equivalent. Safe to delete once the old URL has dropped out of the index
     (roughly 6-12 months). No nav markers here on purpose: it's a redirect,
     not a page, so Sync-Nav will list it as marker-less, which is expected. -->
<link rel="canonical" href="https://venrostech.com/venstock.html">
<meta name="robots" content="noindex, follow">
<meta http-equiv="refresh" content="0; url=https://venrostech.com/venstock.html">
<script>window.location.replace('https://venrostech.com/venstock.html');</script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="eyebrow">// MOVED</div>
    <h1>TallyStock is now VenStock</h1>
    <p>This page has moved to <a href="https://venrostech.com/venstock.html">venrostech.com/venstock.html</a>. You should be redirected automatically.</p>
  </section>
</div>
</body>
</html>
