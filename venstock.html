<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VenStock has moved to Venros Tech | TallyBench</title>
<!-- VenStock moved to venrostech.com on 2026-07-29. It is desktop inventory
     software, and hosting it here muddied what TallyBench is topically about
     — a finance publication should not carry a software product in its nav.
     The books stay, because they are finance content; VenStock is not.

     GitHub Pages serves static files only, so there is no server-side 301:
     canonical + meta refresh + JS is the closest equivalent. The destination
     is a full equivalent page rather than a card in a product list, because
     redirecting to a non-equivalent page reads as a soft 404 and gets dropped.

     No TB: nav markers here on purpose — it is a redirect, not a page, so
     Sync-Nav listing it as marker-less is expected. Safe to delete once the
     URL drops out of the index (roughly 6-12 months). -->
<link rel="canonical" href="https://venrostech.com/venstock.html">
<meta name="robots" content="noindex, follow">
<meta http-equiv="refresh" content="0; url=https://venrostech.com/venstock.html">
<script>window.location.replace('https://venrostech.com/venstock.html');</script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="eyebrow">// MOVED</div>
    <h1>VenStock now lives on Venros Tech</h1>
    <p>VenStock has moved to <a href="https://venrostech.com/venstock.html">venrostech.com/venstock.html</a>, alongside the studio's other products. You should be redirected automatically.</p>
    <p>Looking for a calculator? <a href="index.html">TallyBench's 200 free tools are here</a>.</p>
  </section>
</div>
</body>
</html>
